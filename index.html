<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#135457">
<title>Zonas de Mantenimiento · La Eugenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --petroleo:#135457; --lima:#c4df57; --naranja:#deaf4d;
    --verdecl:#b7d6b5; --hueso:#f5f3ec; --gris:#48797c;
    --zona1:#a9c4cf; --zona2:var(--naranja); --zona3:var(--lima);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#115255;font-family:'Roboto',Arial,sans-serif;color:var(--petroleo);}

  header{padding:16px 16px 4px; text-align:center;}
  header .logo-row{display:flex; align-items:center; justify-content:center; gap:8px;}
  header h1{color:var(--hueso); font-size:18px; margin:0; font-weight:700;}
  header p{color:var(--verdecl); font-size:12.5px; margin:5px auto 0; max-width:480px; line-height:1.5;}
  #menuLogoIcon{ width:22px; height:22px; }

  .legend{display:flex; gap:8px; margin:12px 14px 0;}
  .legend button{
    flex:1; border:1px solid rgba(255,255,255,.5); border-radius:14px; padding:10px 6px;
    background:rgba(255,255,255,.16); color:var(--hueso); font-size:11.5px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.25); transition:background .2s ease, transform .15s ease;
  }
  .legend button:active{ transform:scale(.96); }
  .legend button.active{ background:rgba(255,255,255,.94); color:var(--petroleo); }
  .legend button .sw{ width:20px; height:20px; border-radius:6px; }
  .legend button .letras{ font-weight:400; font-size:10px; opacity:.85; }

  .search-wrap{ margin:12px 14px 0; }
  .search-box{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.5); border-radius:16px; padding:11px 16px; box-shadow:0 4px 14px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.6); transition:background .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);}
  .search-box svg{ stroke:#fff; flex-shrink:0; transition:stroke .25s ease; }
  .search-box input{border:none; outline:none; flex:1; font-size:16px; color:#fff; background:transparent; transition:color .25s ease;}
  .search-box input::placeholder{ color:rgba(255,255,255,.85); }
  .search-box:focus-within{ background:#fff; transform:scale(1.02); }
  .search-box:focus-within svg{ stroke:var(--petroleo); }
  .search-box:focus-within input{ color:var(--petroleo); }
  .search-box:focus-within input::placeholder{ color:var(--gris); }
  .suggestions{margin-top:6px; background:#fff; border-radius:16px; box-shadow:0 6px 16px rgba(0,0,0,.25); overflow:auto; max-height:0; transition:max-height .25s ease;}
  .suggestions.open{max-height:240px;}
  .suggestion-item{padding:11px 16px; font-size:14px; border-top:1px solid var(--hueso); display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .suggestion-item:first-child{border-top:none;}
  .suggestion-item:active{background:var(--hueso);}
  .suggestion-item b{color:var(--petroleo);}
  .suggestion-item span{font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; color:#fff;}

  #mapHost{ margin:14px 10px 0; border-radius:16px; overflow:hidden; background:#0f3f42; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  #mapHost svg{ width:100%; height:auto; display:block; }
  #realSvg #CALLES{ display:none; }

  @keyframes pulseZona1{ 0%,100%{ fill:#00A650; } 50%{ fill:var(--zona1); } }
  @keyframes pulseZona2{ 0%,100%{ fill:#00A650; } 50%{ fill:var(--zona2); } }
  @keyframes pulseZona3{ 0%,100%{ fill:#00A650; } 50%{ fill:var(--zona3); } }
  #Mantenimiento_ZONA_3.destello-real1 *{ animation:pulseZona1 2.2s cubic-bezier(.45,0,.55,1) infinite; }
  #Mantenimiento_ZONA_2.destello-real2 *{ animation:pulseZona2 2.2s cubic-bezier(.45,0,.55,1) infinite; }
  #Mantenimiento_ZONA_1.destello-real3 *{ animation:pulseZona3 2.2s cubic-bezier(.45,0,.55,1) infinite; }

  /* sin tinte permanente: el plano queda verde uniforme, igual al original, y solo cambia de color al pulsar */

  .lote-seleccionado{ animation:none !important; stroke:#fff !important; stroke-width:1 !important; fill-opacity:1 !important; }
  .lote-seleccionado.lz1{ fill:var(--zona1) !important; }
  .lote-seleccionado.lz2{ fill:var(--zona2) !important; }
  .lote-seleccionado.lz3{ fill:var(--zona3) !important; }
  .lote-num{ text-shadow:none; }

  .sheet{
    margin:14px 14px 0; background:rgba(245,243,236,.97); border-radius:18px; padding:14px 16px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    max-height:0; opacity:0; overflow:hidden; transition:max-height .3s ease, opacity .25s ease, margin .3s ease;
  }
  .sheet.show{ max-height:420px; opacity:1; overflow-y:auto; margin-bottom:16px; }
  .sheet .head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .sheet .head .swatch{width:14px; height:14px; border-radius:4px; flex-shrink:0;}
  .sheet .head h3{margin:0; font-size:14.5px; color:var(--petroleo); flex:1;}
  .sheet .head button{background:none; border:none; color:var(--gris); font-size:13px; cursor:pointer;}
  .sheet ul{margin:0 0 8px; padding-left:18px;}
  .sheet li{font-size:12.5px; line-height:1.55; margin-bottom:4px; color:#243b3c;}
  .contactos{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
  .contacto-btn{display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid #e2ddd0; border-radius:10px; padding:8px 10px; text-decoration:none; font-size:12.5px; color:var(--petroleo);}
  .contacto-btn .ir{background:var(--lima); color:var(--petroleo); font-size:10.5px; font-weight:700; padding:5px 9px; border-radius:8px;}

  .cta-row{display:flex; gap:10px; margin:16px 14px 20px;}
  .cta{flex:1; text-align:center; padding:12px 8px; border-radius:14px; font-size:12.5px; font-weight:700; text-decoration:none;}
  .cta.gold{background:var(--naranja); color:var(--petroleo);}
  .cta.lima{background:var(--lima); color:var(--petroleo);}
</style>
</head>

const ZONA_NOMBRE = {1:'Zona 1', 2:'Zona 2', 3:'Zona 3'};
const ZONA_LETRAS = {1:'A · B · C · D · E', 2:'G a R', 3:'S · T · U · V · W'};
const ZONA_GROUP  = {1:'Mantenimiento_ZONA_3', 2:'Mantenimiento_ZONA_2', 3:'Mantenimiento_ZONA_1'};
const ZONA_CLASE  = {1:'destello-real1', 2:'destello-real2', 3:'destello-real3'};

function apagarZonas(){
  [1,2,3].forEach(z=>{
    const g = document.getElementById(ZONA_GROUP[z]);
    if(g) g.classList.remove(ZONA_CLASE[z]);
  });
  document.querySelectorAll('.legend button').forEach(b=>b.classList.remove('active'));
}

let loteSeleccionadoEl = null;
function limpiarLoteSeleccionado(){
  if(loteSeleccionadoEl){
    loteSeleccionadoEl.classList.remove('lote-seleccionado','lz1','lz2','lz3');
    loteSeleccionadoEl = null;
  }
}

const infoZonaHTML = (zona) => `
  <ul>
    <li>Levantamiento de podas y ponchadas por rondas rotativas — se avisa por WhatsApp en <i>La Euge Informa</i>.</li>

  <div class="contactos">

  </div>
`;

function mostrarSheetZona(zona){
  document.getElementById('sheetTitulo').textContent = ZONA_NOMBRE[zona] + ' — Lotes ' + ZONA_LETRAS[zona];
  document.getElementById('sheetSwatch').style.background = 'var(--zona'+zona+')';
  document.getElementById('sheetBody').innerHTML = infoZonaHTML(zona);
  document.getElementById('sheet').classList.add('show');
}

function pulsarZona(zona, updateUrl){
  apagarZonas();
  const g = document.getElementById(ZONA_GROUP[zona]);
  if(g) g.classList.add(ZONA_CLASE[zona]);
  document.querySelector('.legend button[data-zona="'+zona+'"]').classList.add('active');
  mostrarSheetZona(zona);
  if(updateUrl){
    const url = new URL(location.href);
    url.searchParams.set('zona', zona);
    url.searchParams.delete('lote');
    history.replaceState(null,'',url);
  }
}

document.getElementById('sheetClose').addEventListener('click', ()=>{
  document.getElementById('sheet').classList.remove('show');
  apagarZonas();
  limpiarLoteSeleccionado();
  const url = new URL(location.href);
  url.searchParams.delete('zona'); url.searchParams.delete('lote');
  history.replaceState(null,'',url);
});

document.querySelectorAll('.legend button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    limpiarLoteSeleccionado();
    pulsarZona(parseInt(btn.dataset.zona,10), true);
  });
});

  const info = LOTES[id];
  if(!info) return;
  limpiarLoteSeleccionado();
  apagarZonas();
  const el = document.getElementById(info.domId);
  if(el){
    el.classList.add('lote-seleccionado', 'lz'+info.zona);
    loteSeleccionadoEl = el;
  }
  document.querySelector('.legend button[data-zona="'+info.zona+'"]').classList.add('active');
  mostrarSheetZona(info.zona);
  document.getElementById('suggestions').classList.remove('open');
  document.getElementById('searchInput').value = id;
  document.getElementById('searchInput').blur();
  if(updateUrl){
    const url = new URL(location.href);
    url.searchParams.set('lote', id);
    url.searchParams.delete('zona');
    history.replaceState(null,'',url);
  }
}

const input = document.getElementById('searchInput');
const sugBox = document.getElementById('suggestions');
const searchIndex = Object.keys(LOTES).sort();

input.addEventListener('input', ()=>{
  const q = input.value.trim().toUpperCase();
  if(!q){ sugBox.classList.remove('open'); sugBox.innerHTML=''; return; }
  const matches = searchIndex.filter(id=>id.includes(q)).slice(0,20);
  if(!matches.length){ sugBox.classList.remove('open'); sugBox.innerHTML=''; return; }
  sugBox.innerHTML = matches.map(id=>{
    const z = LOTES[id].zona;
    return '<div class="suggestion-item" data-id="'+id+'"><b>'+id+'</b><span style="background:var(--zona'+z+')">'+ZONA_NOMBRE[z]+'</span></div>';
  }).join('');
  sugBox.classList.add('open');
  sugBox.querySelectorAll('.suggestion-item').forEach(item=>{
    item.addEventListener('click', ()=> irALote(item.dataset.id, true));
  });
});
input.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    const q = input.value.trim().toUpperCase();
    if(LOTES[q]) irALote(q, true);
  }
});

(function(){
  const params = new URLSearchParams(location.search);
  const lote = params.get('lote');
  const zona = params.get('zona');
  if(lote && LOTES[lote.toUpperCase()]) irALote(lote.toUpperCase(), false);
  else if(zona && ZONA_GROUP[zona]) pulsarZona(parseInt(zona,10), false);
})();
</script>
</body>
